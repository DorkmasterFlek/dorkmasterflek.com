services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10
    container_name: nginx-proxy
    restart: always
    ports:
      - 443:443
      - 80:80
    networks:
      - smrpg
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./nginx.conf:/etc/nginx/conf.d/my_proxy.conf:ro
  acme-companion:
    image: nginxproxy/acme-companion:2.6
    restart: always
    networks:
      - smrpg
      - smrpg-beta
    env_file:
      - ./.env
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - nginx-proxy

networks:
  smrpg:
    name: smrpg_web_randomizer_default
    external: true
  smrpg-beta:
    name: smrpg_web_randomizer_beta_default
    external: true

volumes:
  certs:
  html:
  vhost:
  acme:
